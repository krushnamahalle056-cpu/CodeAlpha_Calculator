<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculator</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <main class="calculator">
            <div class="calculator-header">
                <h1>Calculator</h1>
                <p>Simple & Responsive</p>
            </div>

            <input
                type="text"
                id="display"
                class="display"
                value="0"
                readonly
                aria-label="Calculator display"
            >
            
            <div class="buttons">
                <button class="function" data-action="clear">AC</button>
                <button class="function" data-action="delete">DEL</button>
                <button class="function" data-action="percent">%</button>
                <button class="operator" data-operator="/">÷</button>

                <button onclick="percentage()">%</button>
                <button onclick="squareRoot()">√</button>
                <button onclick="square()">x²</button>
                <button onclick="power()">xʸ</button>

                <button data-number="7">7</button>
                <button data-number="8">8</button>
                <button data-number="9">9</button>
                <button class="operator" data-operator="*">×</button>

                <button data-number="4">4</button>
                <button data-number="5">5</button>
                <button data-number="6">6</button>
                <button class="operator" data-operator="-">−</button>

                <button data-number="1">1</button>
                <button data-number="2">2</button>
                <button data-number="3">3</button>
                <button class="operator" data-operator="+">+</button>

                <button data-action="sign">+/−</button>
                <button data-number="0">0</button>
                <button data-action="decimal">.</button>
                <button class="equals" data-action="equals">=</button>

                
            </div>

            <p class="hint">Keyboard supported</p>
    
        </main>

        <script src="script.js"></script>
    </body>

</html>
